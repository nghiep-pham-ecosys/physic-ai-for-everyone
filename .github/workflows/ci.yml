name: ci

# Secret scan plus the ci-result aggregate that tools/ship/merge requires (with pr-title).
# ci-ros and ci-site stay separate workflows with their own checks: a `needs:` cannot reach
# jobs in another workflow, and the merge tool already refuses any red or pending check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    # Scan the full history. gitleaks comes from the release tarball, checked against its sha256.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${dir}"
          curl -fsSL --retry 3 -o "${dir}/${tarball}" "${base}/${tarball}"
          curl -fsSL --retry 3 -o "${dir}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -qx "${GITLEAKS_SHA256}  ${tarball}" "${dir}/checksums.txt"
          echo "${GITLEAKS_SHA256}  ${dir}/${tarball}" | sha256sum -c -
          tar -xzf "${dir}/${tarball}" -C "${dir}" gitleaks
          echo "${dir}" >> "${GITHUB_PATH}"
      - name: Scan full history
        run: gitleaks git --redact --no-banner -v .

  ci-result:
    # The check tools/ship/merge requires (with pr-title). gitleaks must succeed.
    # No job here is optional today: a new optional job must be named in the jq test below.
    name: ci-result
    if: always()
    needs: [gitleaks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every core job must succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "${NEEDS}" | jq -e '
            (.gitleaks.result == "success")
            and all(.[]; .result == "success")
          ' > /dev/null; then
            echo "::error::ci-result fails: gitleaks must succeed; no job may fail, be cancelled or be skipped"
            exit 1
          fi
