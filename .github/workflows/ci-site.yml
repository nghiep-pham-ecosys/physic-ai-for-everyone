name: ci-site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same Node.js version as the devcontainer image (docker/Dockerfile).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends just

      # starlight-links-validator fails the build on broken internal links.
      - name: just site-build
        run: just site-build
