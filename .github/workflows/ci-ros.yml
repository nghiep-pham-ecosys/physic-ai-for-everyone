name: ci-ros

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-ros-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Build the PAI-17 devcontainer image; layers are cached in the GitHub Actions cache.
      - name: Build dev image (cached)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          tags: pai-dev:cpu
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run as the runner's UID so build artifacts on the bind mount stay writable.
      - name: just build, just test, lessons (headless)
        run: >
          docker run --rm
          --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "${{ github.workspace }}:/workspace" -w /workspace
          pai-dev:cpu
          bash -c "just build && just test && just lesson 01 && just lesson 02"
